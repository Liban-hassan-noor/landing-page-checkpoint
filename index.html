<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">

                </ul>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Product Card -->
            <div class="bg-white p-4 shadow rounded-lg">
          
                <h3 class="text-xl font-semibold mt-2">Product 1</h3>
                <p class="text-gray-600">Brief description of the product.</p>
                <button class="mt-2 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Shop Now</button>
            </div>
            <!-- Product Card -->
            <div class="bg-white p-4 shadow rounded-lg">
                
                <h3 class="text-xl font-semibold mt-2">Product 2</h3>

            </div>
            <!-- Product Card -->
            <div class="bg-white p-4 shadow rounded-lg">
                
                <h3 class="text-xl font-semibold mt-2">Product 3</h3>
                <p class="text-gray-600">Brief description of the product.</p>
                <button class="mt-2 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Shop Now</button>
            </div>
            <!-- Product Card -->
            <div class="bg-white p-4 shadow rounded-lg">
                
                <h3 class="text-xl font-semibold mt-2">Product 4</h3>
                <p class="text-gray-600">Brief description of the product.</p>
                <button class="mt-2 bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Shop Now</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer id="contact" class="bg-white shadow-md p-4 text-center">
        <p>&copy; 2025 Liban Store. All rights reserved.</p>
    </footer>
</body>
</html>
